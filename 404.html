<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">

  <style>
    :root { --bg:#fbf9f7; --text:#1e1a24; --muted:#5f5868; --accent:#5b2a86; --accent-text:#fff; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141118; --text:#f1edf4; --muted:#b1a8ba; --accent:#c9a4ec; --accent-text:#1a1220; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align:center; }
    .code { font-family: Georgia, "Times New Roman", serif; font-size: clamp(4rem, 18vw, 8rem); font-weight:700; color:var(--accent); line-height:1; margin:0; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.8rem; margin: 16px 0 8px; }
    p { color:var(--muted); margin:0 0 28px; }
    a { display:inline-block; padding:13px 22px; border-radius:999px; background:var(--accent); color:var(--accent-text); text-decoration:none; font-weight:600; }
    a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page doesn't exist</h1>
    <p>The link may be broken, or the page may have moved.</p>

  </main>
</body>
